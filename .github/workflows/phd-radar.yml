name: PhD Radar

on:
  # A push only refreshes the Pages site + re-verifies saved results (CLEANUP_ONLY): it never spends search/AI quota.
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "search.mjs"
      - ".github/workflows/phd-radar.yml"

  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "Cleanup only: re-check saved results + blocked.json, no AI/search API calls"
        type: boolean
        default: false

  schedule:
    # Twice a week (Tuesday + Saturday 06:00 UTC). Cheap now: only new/changed pages go to the AI.
    - cron: "0 6 * * 2,6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "phd-radar"
  cancel-in-progress: false

jobs:
  search-and-deploy:
    name: Search, notify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run PhD search
        id: search
        continue-on-error: true
        env:
          SEARCH_REVIEW_NAME: ${{ vars.SEARCH_REVIEW_NAME }}
          SEARCH_REVIEW_BASE_URL: ${{ vars.SEARCH_REVIEW_BASE_URL }}
          SEARCH_REVIEW_MODEL: ${{ vars.SEARCH_REVIEW_MODEL }}
          SEARCH_REVIEW_FORMAT: ${{ vars.SEARCH_REVIEW_FORMAT }}
          SEARCH_REVIEW_API_KEY: ${{ secrets.SEARCH_REVIEW_API_KEY }}

          SEARCH_NAME: ${{ vars.SEARCH_NAME }}
          SEARCH_BASE_URL: ${{ vars.SEARCH_BASE_URL }}
          SEARCH_FORMAT: ${{ vars.SEARCH_FORMAT }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}

          REVIEW_NAME: ${{ vars.REVIEW_NAME }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_FORMAT: ${{ vars.REVIEW_FORMAT }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLEANUP_ONLY: ${{ github.event.inputs.cleanup_only == 'true' || github.event_name == 'push' }}

          MAX_PAGES: ${{ vars.MAX_PAGES }}
          TIER3_MAX_PAGES: ${{ vars.TIER3_MAX_PAGES }}
          AI_REVIEW_BUDGET: ${{ vars.AI_REVIEW_BUDGET }}
          AI_REVIEW_BUDGET_TIER3: ${{ vars.AI_REVIEW_BUDGET_TIER3 }}
          QUERIES_EU: ${{ vars.QUERIES_EU }}
          QUERIES_TIER3: ${{ vars.QUERIES_TIER3 }}
          EXTRACTION_BATCH_SIZE: ${{ vars.EXTRACTION_BATCH_SIZE }}
          PAGE_TEXT_CHARS: ${{ vars.PAGE_TEXT_CHARS }}
          SEARCH_RESULTS_PER_QUERY: ${{ vars.SEARCH_RESULTS_PER_QUERY }}
          FETCH_CONCURRENCY: ${{ vars.FETCH_CONCURRENCY }}
          AI_CALL_GAP_MS: ${{ vars.AI_CALL_GAP_MS }}
          AI_MAX_ATTEMPTS: ${{ vars.AI_MAX_ATTEMPTS }}
          AI_RETRY_BASE_DELAY_MS: ${{ vars.AI_RETRY_BASE_DELAY_MS }}
          IELTS_LOOKUP_ENABLED: ${{ vars.IELTS_LOOKUP_ENABLED }}
          IELTS_LOOKUP_MIN_SCORE: ${{ vars.IELTS_LOOKUP_MIN_SCORE }}
          IELTS_LOOKUP_MAX_PER_RUN: ${{ vars.IELTS_LOOKUP_MAX_PER_RUN }}

          SEARCH_DEPTH: ${{ vars.SEARCH_DEPTH }}
          SEARCH_TIME_RANGE: ${{ vars.SEARCH_TIME_RANGE }}
          SEARCH_RAW_CONTENT: ${{ vars.SEARCH_RAW_CONTENT }}
          RECHECK_DAYS: ${{ vars.RECHECK_DAYS }}
          BACKLOG_PER_RUN: ${{ vars.BACKLOG_PER_RUN }}
          PRESCREEN_MIN_THEME: ${{ vars.PRESCREEN_MIN_THEME }}
          MIN_FIT: ${{ vars.MIN_FIT }}
          MIN_TOPIC: ${{ vars.MIN_TOPIC }}
          MIN_OVERALL: ${{ vars.MIN_OVERALL }}
        run: |
          node search.mjs

      - name: Commit updated results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in results.json notified.json sources.json seen.json universities.json archive.json; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PhD radar results [skip ci]"

            for attempt in 1 2 3 4 5; do
              echo "Preparing push (attempt $attempt/5)..."
              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase conflict detected. Resolving generated result files..."
                git checkout --theirs results.json notified.json sources.json seen.json universities.json archive.json 2>/dev/null || true
                for f in results.json notified.json sources.json seen.json universities.json archive.json; do
                  [ -f "$f" ] && git add "$f"
                done
                GIT_EDITOR=true git rebase --continue
              fi

              if git push origin HEAD:main; then
                echo "Results pushed successfully."
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi

              echo "Remote main changed during push; retrying..."
              sleep 3
            done
          fi

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Prepare site (only what the page needs)
        if: always()
        run: |
          mkdir -p _site
          for f in index.html results.json sources.json; do
            [ -f "$f" ] && cp "$f" _site/
          done

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      # Make a broken search visible (red run) after results were committed and the site deployed.
      - name: Fail the run if the search step failed
        if: steps.search.outcome == 'failure'
        run: |
          echo "The search step failed - see its log (a Telegram alert was sent if configured)."
          exit 1
