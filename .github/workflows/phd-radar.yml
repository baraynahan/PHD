name: PhD Radar

on:
  push:
    branches:
      - main
    # Don't burn API credits on pushes that only touch data/docs.
    paths-ignore:
      - "results.json"
      - "notified.json"
      - "sources.json"
      - "**.md"
      - "blocked.json"

  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "Cleanup only: re-check saved results + blocked.json, no AI/search API calls"
        type: boolean
        default: false

  schedule:
    - cron: "0 6 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "phd-radar"
  cancel-in-progress: false

jobs:
  search-and-deploy:
    name: Search, notify, and deploy
    runs-on: ubuntu-latest
    # Tier 3 search adds a few minutes; hard stop so a hung request can't eat Actions minutes.
    timeout-minutes: 45

    steps:
      # ----------------------------------------
      # 1. Get repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. Install Bun
      # ----------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ----------------------------------------
      # 3. Run PhD search (Europe first + Canada/Australia/NZ, never US) + Telegram
      # ----------------------------------------
      - name: Run PhD search
        env:
          # ------------------------------------------------------------
          # All provider settings come from repo Settings > Secrets and
          # variables > Actions. To switch provider, change the Variables
          # (+ the API key Secret). No code edits needed.
          #   *_BASE_URL : API link (base URL or full endpoint)
          #   *_MODEL    : model name
          #   *_FORMAT   : optional, auto-detected from the link
          #                AI: gemini | openai   Search: tavily | serper | brave
          #   *_NAME     : label shown on dashboard / Telegram
          # A pipeline whose settings are missing is just skipped.
          # ------------------------------------------------------------

          # Pipeline 1: one AI that does BOTH search and review
          SEARCH_REVIEW_NAME: ${{ vars.SEARCH_REVIEW_NAME }}
          SEARCH_REVIEW_BASE_URL: ${{ vars.SEARCH_REVIEW_BASE_URL }}
          SEARCH_REVIEW_MODEL: ${{ vars.SEARCH_REVIEW_MODEL }}
          SEARCH_REVIEW_FORMAT: ${{ vars.SEARCH_REVIEW_FORMAT }}
          SEARCH_REVIEW_API_KEY: ${{ secrets.SEARCH_REVIEW_API_KEY }}

          # Pipeline 2, step 1: search-only API (finds the links)
          SEARCH_NAME: ${{ vars.SEARCH_NAME }}
          SEARCH_BASE_URL: ${{ vars.SEARCH_BASE_URL }}
          SEARCH_FORMAT: ${{ vars.SEARCH_FORMAT }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}

          # Pipeline 2, step 2: review-only AI (reads + scores the pages)
          REVIEW_NAME: ${{ vars.REVIEW_NAME }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_FORMAT: ${{ vars.REVIEW_FORMAT }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # true only when you tick "Cleanup only" on a manual run
          CLEANUP_ONLY: ${{ github.event.inputs.cleanup_only == 'true' }}
        run: |
          bun search.mjs

      # ----------------------------------------
      # 4. Save updated results
      # ----------------------------------------
      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.json notified.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PhD radar results [skip ci]"

            # The repository can change while the radar is running.
            # Rebase onto the latest main, then retry the push if another
            # commit lands between fetch/rebase and push.
            for attempt in 1 2 3 4 5; do
              echo "Preparing push (attempt $attempt/5)..."
              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase conflict detected. Resolving generated result files..."
                git checkout --theirs results.json notified.json
                git add results.json notified.json
                GIT_EDITOR=true git rebase --continue
              fi

              if git push origin HEAD:main; then
                echo "Results pushed successfully."
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi

              echo "Remote main changed during push; retrying..."
              sleep 3
            done
          fi

      # ----------------------------------------
      # 5. Configure GitHub Pages
      # ----------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ----------------------------------------
      # 6. Upload dashboard
      # ----------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      # ----------------------------------------
      # 7. Deploy dashboard
      # ----------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
