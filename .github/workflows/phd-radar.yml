name: PhD Radar

on:
  push:
    branches:
      - main
    paths-ignore:
      - "results.json"
      - "notified.json"
      - "sources.json"
      - "seen.json"
      - "universities.json"
      - "archive.json"
      - "blocked.json"
      - "**.md"

  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "Cleanup only: re-check saved results + blocked.json, no AI/search API calls"
        type: boolean
        default: false

  schedule:
    # Twice a week: Tuesday and Saturday, 06:00 UTC.
    - cron: "0 6 * * 2,6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "phd-radar"
  cancel-in-progress: false

jobs:
  search-and-deploy:
    name: Search, notify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run PhD search
        # A provider failure should not throw away the results that DID come in.
        continue-on-error: true
        env:
          SEARCH_REVIEW_NAME: ${{ vars.SEARCH_REVIEW_NAME }}
          SEARCH_REVIEW_BASE_URL: ${{ vars.SEARCH_REVIEW_BASE_URL }}
          SEARCH_REVIEW_MODEL: ${{ vars.SEARCH_REVIEW_MODEL }}
          SEARCH_REVIEW_FORMAT: ${{ vars.SEARCH_REVIEW_FORMAT }}
          SEARCH_REVIEW_API_KEY: ${{ secrets.SEARCH_REVIEW_API_KEY }}

          SEARCH_NAME: ${{ vars.SEARCH_NAME }}
          SEARCH_BASE_URL: ${{ vars.SEARCH_BASE_URL }}
          SEARCH_FORMAT: ${{ vars.SEARCH_FORMAT }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}

          REVIEW_NAME: ${{ vars.REVIEW_NAME }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_FORMAT: ${{ vars.REVIEW_FORMAT }}
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLEANUP_ONLY: ${{ github.event.inputs.cleanup_only == 'true' }}
        run: |
          bun search.mjs

      - name: Commit updated results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in results.json notified.json sources.json seen.json universities.json archive.json; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PhD radar results [skip ci]"

            for attempt in 1 2 3 4 5; do
              echo "Preparing push (attempt $attempt/5)..."
              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase conflict detected. Resolving generated result files..."
                git checkout --theirs results.json notified.json sources.json seen.json universities.json archive.json 2>/dev/null || true
                for f in results.json notified.json sources.json seen.json universities.json archive.json; do
                  [ -f "$f" ] && git add "$f"
                done
                GIT_EDITOR=true git rebase --continue
              fi

              if git push origin HEAD:main; then
                echo "Results pushed successfully."
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi

              echo "Remote main changed during push; retrying..."
              sleep 3
            done
          fi

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
