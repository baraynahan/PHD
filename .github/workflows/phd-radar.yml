name: PhD Radar

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "phd-radar"
  cancel-in-progress: false

jobs:
  search-and-deploy:
    name: Search, notify, and deploy
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Get repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ----------------------------------------
      # 2. Install Bun
      # ----------------------------------------
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ----------------------------------------
      # 3. Run PhD search + Telegram
      # ----------------------------------------
      - name: Run PhD search
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APMIX_API_KEY: ${{ secrets.APMIX_API_KEY }}
          APMIX_MODEL: ${{ vars.APMIX_MODEL || 'deepseek/deepseek-v4.1-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bun search.mjs

      # ----------------------------------------
      # 4. Save updated results
      # ----------------------------------------
      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.json notified.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PhD radar results [skip ci]"

            # The repository can change while the radar is running.
            # Rebase onto the latest main, then retry the push if another
            # commit lands between fetch/rebase and push.
            for attempt in 1 2 3 4 5; do
              echo "Preparing push (attempt $attempt/5)..."
              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase conflict detected. Resolving generated result files..."
                git checkout --theirs results.json notified.json
                git add results.json notified.json
                GIT_EDITOR=true git rebase --continue
              fi

              if git push origin HEAD:main; then
                echo "Results pushed successfully."
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi

              echo "Remote main changed during push; retrying..."
              sleep 3
            done
          fi

      # ----------------------------------------
      # 5. Configure GitHub Pages
      # ----------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ----------------------------------------
      # 6. Upload dashboard
      # ----------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      # ----------------------------------------
      # 7. Deploy dashboard
      # ----------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
