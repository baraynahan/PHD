name: PhD Radar

on:
  # A push only refreshes the Pages site + re-verifies saved results (CLEANUP_ONLY): it never spends search/AI quota.
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "search.mjs"
      - ".github/workflows/phd-radar.yml"

  workflow_dispatch:
    inputs:
      cleanup_only:
        description: "Cleanup only: re-check saved results + blocked.json, no AI/search API calls"
        type: boolean
        default: false
      clear_previous_results:
        description: "Start fresh: replace active results with this run's new findings (keeps caches and Telegram history)"
        type: boolean
        default: false

  schedule:
    # Weekly on Saturday at 08:00 Asia/Tehran (04:30 UTC).
    - cron: "30 4 * * 6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "phd-radar"
  cancel-in-progress: false

jobs:
  search-and-deploy:
    name: Search, notify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        id: syntax
        run: node --check search.mjs

      - name: Run offline regression tests
        id: self_test
        env:
          SELF_TEST: "true"
        run: node search.mjs

      - name: Run PhD search
        id: search
        continue-on-error: true
        env:
          SEARCH_1_NAME: ${{ vars.SEARCH_1_NAME }}
          SEARCH_1_BASE_URL: ${{ vars.SEARCH_1_BASE_URL }}
          SEARCH_1_FORMAT: ${{ vars.SEARCH_1_FORMAT }}
          SEARCH_1_MODEL: ${{ vars.SEARCH_1_MODEL }}
          SEARCH_1_API_KEY: ${{ secrets.SEARCH_1_API_KEY }}

          SEARCH_2_NAME: ${{ vars.SEARCH_2_NAME }}
          SEARCH_2_BASE_URL: ${{ vars.SEARCH_2_BASE_URL }}
          SEARCH_2_FORMAT: ${{ vars.SEARCH_2_FORMAT }}
          SEARCH_2_MODEL: ${{ vars.SEARCH_2_MODEL }}
          SEARCH_2_API_KEY: ${{ secrets.SEARCH_2_API_KEY }}

          SEARCH_3_NAME: ${{ vars.SEARCH_3_NAME }}
          SEARCH_3_BASE_URL: ${{ vars.SEARCH_3_BASE_URL }}
          SEARCH_3_FORMAT: ${{ vars.SEARCH_3_FORMAT }}
          SEARCH_3_MODEL: ${{ vars.SEARCH_3_MODEL }}
          SEARCH_3_API_KEY: ${{ secrets.SEARCH_3_API_KEY }}

          REVIEW_1_NAME: ${{ vars.REVIEW_1_NAME }}
          REVIEW_1_BASE_URL: ${{ vars.REVIEW_1_BASE_URL }}
          REVIEW_1_MODEL: ${{ vars.REVIEW_1_MODEL }}
          REVIEW_1_FORMAT: ${{ vars.REVIEW_1_FORMAT }}
          REVIEW_1_API_KEY: ${{ secrets.REVIEW_1_API_KEY }}

          REVIEW_2_NAME: ${{ vars.REVIEW_2_NAME }}
          REVIEW_2_BASE_URL: ${{ vars.REVIEW_2_BASE_URL }}
          REVIEW_2_MODEL: ${{ vars.REVIEW_2_MODEL }}
          REVIEW_2_FORMAT: ${{ vars.REVIEW_2_FORMAT }}
          REVIEW_2_API_KEY: ${{ secrets.REVIEW_2_API_KEY }}

          REVIEW_3_NAME: ${{ vars.REVIEW_3_NAME }}
          REVIEW_3_BASE_URL: ${{ vars.REVIEW_3_BASE_URL }}
          REVIEW_3_MODEL: ${{ vars.REVIEW_3_MODEL }}
          REVIEW_3_FORMAT: ${{ vars.REVIEW_3_FORMAT }}
          REVIEW_3_API_KEY: ${{ secrets.REVIEW_3_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLEANUP_ONLY: ${{ github.event.inputs.cleanup_only == 'true' || github.event_name == 'push' }}
          CLEAR_PREVIOUS_RESULTS: ${{ github.event.inputs.clear_previous_results == 'true' }}

          MAX_PAGES: ${{ vars.MAX_PAGES }}
          TIER3_MAX_PAGES: ${{ vars.TIER3_MAX_PAGES }}
          AI_REVIEW_BUDGET: ${{ vars.AI_REVIEW_BUDGET }}
          AI_REVIEW_BUDGET_TIER3: ${{ vars.AI_REVIEW_BUDGET_TIER3 }}
          QUERIES_EU: ${{ vars.QUERIES_EU }}
          QUERIES_TIER3: ${{ vars.QUERIES_TIER3 }}
          EXTRACTION_BATCH_SIZE: ${{ vars.EXTRACTION_BATCH_SIZE }}
          PAGE_TEXT_CHARS: ${{ vars.PAGE_TEXT_CHARS }}
          SEARCH_RESULTS_PER_QUERY: ${{ vars.SEARCH_RESULTS_PER_QUERY }}
          FETCH_CONCURRENCY: ${{ vars.FETCH_CONCURRENCY }}
          AI_CALL_GAP_MS: ${{ vars.AI_CALL_GAP_MS }}
          AI_MAX_ATTEMPTS: ${{ vars.AI_MAX_ATTEMPTS }}
          AI_RETRY_BASE_DELAY_MS: ${{ vars.AI_RETRY_BASE_DELAY_MS }}
          IELTS_LOOKUP_ENABLED: ${{ vars.IELTS_LOOKUP_ENABLED }}
          IELTS_LOOKUP_MIN_SCORE: ${{ vars.IELTS_LOOKUP_MIN_SCORE }}
          IELTS_LOOKUP_MAX_PER_RUN: ${{ vars.IELTS_LOOKUP_MAX_PER_RUN }}

          SEARCH_DEPTH: ${{ vars.SEARCH_DEPTH }}
          SEARCH_TIME_RANGE: ${{ vars.SEARCH_TIME_RANGE }}
          SEARCH_RAW_CONTENT: ${{ vars.SEARCH_RAW_CONTENT }}
          RECHECK_DAYS: ${{ vars.RECHECK_DAYS }}
          BACKLOG_PER_RUN: ${{ vars.BACKLOG_PER_RUN }}
          PRESCREEN_MIN_THEME: ${{ vars.PRESCREEN_MIN_THEME }}
          MIN_FIT: ${{ vars.MIN_FIT }}
          MIN_TOPIC: ${{ vars.MIN_TOPIC }}
          MIN_OVERALL: ${{ vars.MIN_OVERALL }}
        run: |
          node search.mjs

      - name: Commit updated results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in results.json notified.json sources.json seen.json universities.json archive.json; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PhD radar results [skip ci]"

            for attempt in 1 2 3 4 5; do
              echo "Preparing push (attempt $attempt/5)..."
              git fetch origin main

              if ! git rebase origin/main; then
                echo "Rebase conflict detected. Resolving generated result files..."
                git checkout --theirs results.json notified.json sources.json seen.json universities.json archive.json 2>/dev/null || true
                for f in results.json notified.json sources.json seen.json universities.json archive.json; do
                  [ -f "$f" ] && git add "$f"
                done
                GIT_EDITOR=true git rebase --continue
              fi

              if git push origin HEAD:main; then
                echo "Results pushed successfully."
                break
              fi

              if [ "$attempt" -eq 5 ]; then
                echo "Failed to push after 5 attempts."
                exit 1
              fi

              echo "Remote main changed during push; retrying..."
              sleep 3
            done
          fi

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Prepare site and publish the schedule from this workflow
        if: always()
        run: |
          mkdir -p _site
          for f in index.html results.json sources.json; do
            [ -f "$f" ] && cp "$f" _site/
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const workflow = fs.readFileSync(".github/workflows/phd-radar.yml", "utf8");
          const scheduleBlock = workflow.match(/schedule:\\s*([\\s\\S]*?)(?=\\n\\S|$)/);
          const cron = scheduleBlock?.[1]?.match(/cron:\\s*["']([^"']+)["']/)?.[1];
          if (!cron) throw new Error("Could not read schedule cron from workflow.");
          const fields = cron.trim().split(/\\s+/);
          if (fields.length !== 5 || !/^\\d+$/.test(fields[0]) || !/^\\d+$/.test(fields[1]) || !/^\\d+$/.test(fields[4])) {
            throw new Error("Schedule display currently requires numeric minute, hour and weekday fields.");
          }
          const [minute, hour, , , weekday] = fields.map(Number);
          const reference = new Date(Date.UTC(2026, 0, 4 + weekday, hour, minute));
          const parts = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Tehran", weekday: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
          }).formatToParts(reference);
          const value = Object.fromEntries(parts.map(part => [part.type, part.value]));
          const time = `${value.hour.padStart(2, "0")}:${value.minute.padStart(2, "0")}`;
          const data = {
            cron,
            timezone: "Asia/Tehran",
            day: value.weekday,
            time,
            label: `Automatic search: every ${value.weekday} at ${time} (Tehran time).`
          };
          fs.writeFileSync("_site/schedule.json", JSON.stringify(data, null, 2) + "\\n");
          console.log(data.label + ` [workflow cron: ${cron}]`);
          NODE

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      # Make a broken search visible (red run) after results were committed and the site deployed.
      - name: Fail the run if the search step failed
        if: always() && (steps.search.outcome == 'failure' || steps.syntax.outcome == 'failure' || steps.self_test.outcome == 'failure')
        run: |
          echo "The syntax check, regression tests, or search step failed - see its log."
          exit 1
